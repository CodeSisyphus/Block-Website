<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Blocker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <img src="../icons/icon48.png" alt="Site Blocker" class="logo">
      <h1>Site Blocker</h1>
    </header>

    <div class="input-row">
      <input type="text" id="domain-input" placeholder="e.g. example.com" spellcheck="false" autocomplete="off">
      <button id="add-btn" title="Block this site">Block</button>
    </div>
    <p id="error-msg" class="error hidden"></p>

    <div id="empty-state" class="empty-state hidden">
      <p>No blocked sites yet.<br>Add a domain above to get started.</p>
    </div>

    <ul id="site-list" class="site-list"></ul>

    <footer>
      <p>All data stays on your device.</p>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
