<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Blocker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <img src="../icons/icon48.png" alt="Site Blocker" class="logo">
      <h1>Site Blocker</h1>
    </header>

    <div class="input-row">
      <input type="text" id="domain-input" placeholder="e.g. example.com" spellcheck="false" autocomplete="off">
      <button id="add-btn" title="Block this site">Block</button>
    </div>
    <p id="error-msg" class="error hidden"></p>

    <!-- Preset categories -->
    <div class="presets-section">
      <p class="presets-label">Quick block presets:</p>
      <div class="presets-row">
        <button class="preset-btn" data-preset="social">Social Media</button>
        <button class="preset-btn" data-preset="video">Video Streaming</button>
        <button class="preset-btn" data-preset="news">News</button>
        <button class="preset-btn" data-preset="shopping">Shopping</button>
        <button class="preset-btn" data-preset="gaming">Gaming</button>
        <button class="preset-btn preset-warn" data-preset="chinapropaganda">China Propaganda</button>
        <button class="preset-btn preset-warn" data-preset="russiapropaganda">Russia Propaganda</button>
      </div>
    </div>

    <!-- Preset picker overlay -->
    <div id="preset-picker" class="preset-picker hidden">
      <div class="preset-picker-header">
        <span id="preset-picker-title"></span>
        <button id="preset-picker-close" class="preset-picker-close">&times;</button>
      </div>
      <div class="preset-picker-actions">
        <button id="preset-select-all" class="preset-link-btn">Select all</button>
        <button id="preset-select-none" class="preset-link-btn">Select none</button>
      </div>
      <ul id="preset-picker-list" class="preset-picker-list"></ul>
      <button id="preset-picker-confirm" class="preset-confirm-btn">Block selected</button>
    </div>

    <div id="empty-state" class="empty-state hidden">
      <p>No blocked sites yet.<br>Add a domain above or pick a preset.</p>
    </div>

    <ul id="site-list" class="site-list"></ul>

    <!-- Import / Export -->
    <div class="io-row">
      <button id="export-btn" class="io-btn" title="Export blocked sites to a file">Export</button>
      <button id="import-btn" class="io-btn" title="Import blocked sites from a file">Import</button>
      <input type="file" id="import-file" accept=".json" class="hidden">
    </div>

    <footer>
      <p>All data stays on your device.</p>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
